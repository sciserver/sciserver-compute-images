[supervisord]
logfile=/tmp/supervisord.log
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true

[program:vncserver]
# Run VNC server in the foreground (-fg) on port 5901
command=/usr/bin/vncserver -verbose -xstartup /opt/xstartup -geometry 1280x840 -SecurityTypes None -fg :1
autorestart=true
priority=10

[program:websockify]
# Listen on 6080 and proxy traffic to the VNC server on 5901
# NOte, use 127.0.0.1 instead of localhost for the VNC server address so it works with the Kraken
command=websockify -v --web /opt/novnc 6080 127.0.0.1:5901
autorestart=true
priority=20



